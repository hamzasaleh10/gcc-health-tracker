name: Refresh data

# Re-pulls World Bank and WHO data on the 2nd of every month and commits it
# if anything changed. GitHub Pages republishes the site automatically.
on:
  schedule:
    - cron: "17 13 2 * *"   # 13:17 UTC on the 2nd of each month
  workflow_dispatch:         # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and validate data
        run: python scripts/refresh.py data

      - name: Commit if the data changed
        run: |
          # meta.json always carries a new timestamp; only commit when the data itself moved.
          if git diff --quiet -- data/gcc_worldbank.json data/gcc_obesity_who.json data/gcc_hale_who.json data/gcc_le_who.json data/gcc_nurse_midwife_who.json data/gcc_population_projections.json && [ -z "$(git status --porcelain data/gcc_hale_who.json data/gcc_le_who.json data/gcc_nurse_midwife_who.json data/gcc_population_projections.json)" ]; then
            echo "No new data this month."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push
